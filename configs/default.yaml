name: MSLKAD
home_dir: .
resume: false
debug: false
run: true
# Direct checkpoint path, or a previous run name under home_dir/runs.
weights: null
load: null
load_model: latest

data:
  # Each split must contain LR/ and HR/ with matching filename stems.
  train_data_root: datasets/Rain200H/train
  val_data_root: datasets/Rain200H/test
  patch_size: 128
  batch_size: 8
  n_threads: 4
  max_evaluation_count: 10
  test_data: Rain200H

train:
  test_only: false
  save_dir: outputs
  gpus: [0]
  # Required for training: local torchvision VGG19 state_dict, not bundled.
  vgg_model_path: pretrained/vgg19-dcbb9e9d.pth
  max_iter: 100000
  print_loss: 100
  print_lr: 10000
  save_every: 10000
  # 0 evaluates at the end of each data-loader epoch, as in the original code.
  eval_every: 0
  eval_tile_size: 0
  eval_tile_overlap: 32

sys:
  log: true
  seed: 1
  cpu: false

model:
  MSLKAD:
    model_name: MSLKAD
    model_args:
      n_resblocks: 9
      n_resgroups: 4
      n_feats: 180
    optim_args:
      type: AdamW
      lr: 0.0001
      weight_decay: 0.0001
      betas: [0.9, 0.999]
    scheduler:
      type: CosineAnnealingLR
      # T_max defaults to train.max_iter, including when overridden on the CLI.
      eta_min: 0.000001
